<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Coralpib - Player</title>
</head>
<body style="text-align: center; font-family: sans-serif; margin-top: 50px; background-color: #f4f4f4;">
  <h2>Coralpib - Player Online</h2>
  
  <audio id="player" controls style="width: 300px; margin-top: 20px;"></audio>
  
  <script>
    const audio = document.getElementById('player');
    
    // Lista com os nomes exatos dos seus arquivos no repositório
    const playlist = [
      '01 - Grupo Aquila - Celebrai Nasceu Jesus Crist....mp3',
      '02 - Noite de Natal - 1º soprano.mp3',
      '03 - Tempo de Natal - soprano 1.mp3',
      '04 - Grupo Aquila - Ouco Anjos a Cantar Medl....mp3',
      '05 - Grupo Aquila - O Natal e Cristo.mp3',
      '06 - Grupo Aquila - Seguindo a Luz.mp3',
      '07 - Grupo Aquila - Ao Rei Eterno Demos Glori....mp3',
      '08 - Grupo Aquila - Da Proxima Vez.mp3',
      '09 - Grupo Aquila - Messias Medley.mp3'
    ];
    
    let currentTrack = 0;
    audio.src = playlist[currentTrack];

    // Toca a próxima música automaticamente ao terminar
    audio.addEventListener('ended', () => {
      currentTrack = (currentTrack + 1) % playlist.length;
      audio.src = playlist[currentTrack];
      audio.play();
    });
  </script>
</body>
</html>
