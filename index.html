<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Coralpib - Player</title>
  <style>
    body { text-align: center; font-family: sans-serif; margin-top: 40px; background: linear-gradient(135deg, #1f1c2c, #928dab); color: #ffffff; min-height: 100vh; }
    h2 { color: #ffeb3b; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
    ul { list-style: none; padding: 0; max-width: 500px; margin: 20px auto; text-align: left; background: #2b2640; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); overflow: hidden; }
    li { padding: 14px 18px; border-bottom: 1px solid #3d355c; cursor: pointer; transition: all 0.2s; color: #d0cce1; }
    li:last-child { border-bottom: none; }
    li:hover { background: #3d355c; color: #ffffff; padding-left: 22px; }
    li.active { background: #673ab7; font-weight: bold; color: #ffffff; border-left: 6px solid #ff4081; }
    audio { filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }
  </style>
</head>
<body>
  <h2>Coralpib - Player Online</h2>
  <audio id="player" controls style="width: 320px; margin-top: 10px;" autoplay></audio>
  
  <ul id="playlist"></ul>
  
  <script>
    const audio = document.getElementById('player');
    const playlistElement = document.getElementById('playlist');
    
    // Nomes dos arquivos reais com a extensão .mp3 no final para o player conseguir tocar
    const files = [
      '01 - Grupo Aquila - Celebrai Nasceu Jesus Cristo.mp3',
      '02 - Noite de Natal - 1º soprano.mp3',
      '03 - Tempo de Natal - soprano 1.mp3',
      '04 - Grupo Aquila - Ouco Anjos a Cantar Medley.mp3',
      '05 - Grupo Aquila - O Natal e Cristo.mp3',
      '06 - Grupo Aquila - Seguindo a Luz.mp3',
      '07 - Grupo Aquila - Ao Rei Eterno Demos Gloria.mp3',
      '08 - Grupo Aquila - Da Proxima Vez.mp3',
      '09 - Grupo Aquila - Messias Medley.mp3'
    ];

    // Os nomes bonitos que você definiu para aparecerem na tela
    const displayNames = [
      '1 - Celebrai Nasceu Jesus Cristo',
      '2 - Noite de Natal',
      '3 - Tempo de Natal (Ouçam os sinos)',
      '4 - Ouço anjos a cantar Medley',
      '5 - O Natal é Cristo',
      '6 - Seguindo a Luz',
      '7 - Ao Rei Eterno demos Glória',
      '8 - Da próxima vez',
      '9 - Messias Medley'
    ];
    
    let currentTrack = 0;

    function loadTrack(index) {
      currentTrack = index;
      audio.src = files[currentTrack];
      audio.play();
      updateActiveItem();
    }

    function updateActiveItem() {
      const items = playlistElement.querySelectorAll('li');
      items.forEach((item, idx) => {
        if (idx === currentTrack) {
          item.classList.add('active');
        } else {
          item.classList.remove('active');
        }
      });
    }

    displayNames.forEach((name, index) => {
      const li = document.createElement('li');
      li.textContent = name;
      li.onclick = () => loadTrack(index);
      playlistElement.appendChild(li);
    });

    audio.addEventListener('ended', () => {
      currentTrack = (currentTrack + 1) % files.length;
      loadTrack(currentTrack);
    });

    audio.src = files[currentTrack];
    updateActiveItem();
  </script>
</body>
</html>
