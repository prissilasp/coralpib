<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coralpib - Player</title>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    body { text-align: center; font-family: sans-serif; padding: 20px 10px; background: linear-gradient(135deg, #161214, #261a1f); color: #f5f5f5; min-height: 100vh; box-sizing: border-box; }
    h2 { color: #c5a059; text-shadow: 0 2px 4px rgba(0,0,0,0.6); font-size: 1.5rem; letter-spacing: 0.5px; margin-bottom: 5px; }
    .author { color: #b39352; font-size: 0.95rem; font-style: italic; margin-top: 0; margin-bottom: 15px; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
    ul { list-style: none; padding: 0; width: 100%; max-width: 450px; margin: 20px auto; text-align: left; background: #221a1d; border: 1px solid #4a1525; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.6); overflow: hidden; box-sizing: border-box; }
    li { padding: 14px 16px; border-bottom: 1px solid #361720; cursor: pointer; transition: all 0.2s; color: #e0d0d4; font-size: 0.95rem; }
    li:last-child { border-bottom: none; }
    li:hover { background: #3b1622; color: #ffffff; }
    li.active { background: #5c182d; font-weight: bold; color: #fff; border-left: 6px solid #c5a059; }
    audio { width: 100%; max-width: 450px; margin-top: 10px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4)); }
  </style>
</head>
<body>
  <h2>Coralpib - Player Online</h2>
  <div class="author">by Prissíla</div>
  <audio id="player" controls></audio>
  
  <ul id="playlist"></ul>
  
  <script>
    const audio = document.getElementById('player');
    const playlistElement = document.getElementById('playlist');
    
    const tracks = [
      { name: '1 - Celebrai Nasceu Jesus Cristo', file: '1 - Celebrai Nasceu Jesus Cristo.mp3' },
      { name: '2 - Noite de Natal', file: '2 - Noite de Natal.mp3' },
      { name: '3 - Tempo de Natal (Ouçam os sinos)', file: '3 - Tempo de Natal (Oucam os sinos).mp3' },
      { name: '4 - Ouço anjos a cantar Medley', file: '4 - Ouco anjos a cantar Medley.mp3' },
      { name: '5 - O Natal é Cristo', file: '5 - O Natal e Cristo.mp3' },
      { name: '6 - Seguindo a Luz', file: '6 - Seguindo a Luz.mp3' },
      { name: '7 - Ao Rei Eterno demos Glória', file: '7 - Ao Rei Eterno demos Gloria.mp3' },
      { name: '8 - Da próxima vez', file: '8 - Da proxima vez.mp3' },
      { name: '9 - Messias Medley', file: '9 - Messias Medley.mp3' }
    ];
    
    let currentTrack = 0;

    function loadTrack(index, playIt = true) {
      currentTrack = index;
      audio.src = tracks[currentTrack].file;
      updateActiveItem();
      if (playIt) {
        audio.play().catch(e => console.log("Aguardando clique do usuário"));
      }
    }

    function updateActiveItem() {
      const items = playlistElement.querySelectorAll('li');
      items.forEach((item, idx) => {
        if (idx === currentTrack) {
          item.classList.add('active');
        } else {
          item.classList.remove('active');
        }
      });
    }

    tracks.forEach((track, index) => {
      const li = document.createElement('li');
      li.textContent = track.name;
      li.onclick = () => loadTrack(index, true);
      playlistElement.appendChild(li);
    });

    audio.addEventListener('ended', () => {
      currentTrack = (currentTrack + 1) % tracks.length;
      loadTrack(currentTrack, true);
    });

    loadTrack(0, false);
  </script>
</body>
</html>
