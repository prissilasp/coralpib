<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coralpib - Player</title>
  <style>
    body { text-align: center; font-family: sans-serif; margin: 20px 10px; background: linear-gradient(135deg, #121212, #1c1818); color: #f5f5f5; min-height: 100vh; }
    h2 { color: #d4af37; text-shadow: 0 2px 4px rgba(0,0,0,0.5); font-size: 1.5rem; letter-spacing: 0.5px; }
    ul { list-style: none; padding: 0; width: 100%; max-width: 450px; margin: 20px auto; text-align: left; background: #221a1d; border: 1px solid #4a1525; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.6); overflow: hidden; box-sizing: border-box; }
    li { padding: 14px 16px; border-bottom: 1px solid #361720; cursor: pointer; transition: all 0.2s; color: #e0d0d4; font-size: 0.95rem; }
    li:last-child { border-bottom: none; }
    li:hover { background: #3b1622; color: #ffffff; }
    li.active { background: #5c182d; font-weight: bold; color: #fff; border-left: 6px solid #d4af37; }
    audio { width: 100%; max-width: 450px; margin-top: 10px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4)); }
  </style>
</head>
<body>
  <h2>Coralpib - Player Online</h2>
  <audio id="player" controls autoplay></audio>
  
  <ul id="playlist"></ul>
  
  <script>
    const audio = document.getElementById('player');
    const playlistElement = document.getElementById('playlist');
    
    const files = [
      '1 - Celebrai Nasceu Jesus Cristo.mp3',
      '2 - Noite de Natal.mp3',
      '3 - Tempo de Natal (Oucam os sinos).mp3',
      '4 - Ouco anjos a cantar Medley.mp3',
      '5 - O Natal e Cristo.mp3',
      '6 - Seguindo a Luz.mp3',
      '7 - Ao Rei Eterno demos Gloria.mp3',
      '8 - Da proxima vez.mp3',
      '9 - Messias Medley.mp3'
    ];

    const displayNames = [
      '1 - Celebrai Nasceu Jesus Cristo',
      '2 - Noite de Natal',
      '3 - Tempo de Natal (Ouçam os sinos)',
      '4 - Ouço anjos a cantar Medley',
      '5 - O Natal é Cristo',
      '6 - Seguindo a Luz',
      '7 - Ao Rei Eterno demos Glória',
      '8 - Da próxima vez',
      '9 - Messias Medley'
    ];
    
    let currentTrack = 0;

    function loadTrack(index) {
      currentTrack = index;
      audio.src = files[currentTrack];
      audio.play();
      updateActiveItem();
    }

    function updateActiveItem() {
      const items = playlistElement.querySelectorAll('li');
      items.forEach((item, idx) => {
        if (idx === currentTrack) {
          item.classList.add('active');
        } else {
          item.classList.remove('active');
        }
      });
    }

    displayNames.forEach((name, index) => {
      const li = document.createElement('li');
      li.textContent = name;
      li.onclick = () => loadTrack(index);
      playlistElement.appendChild(li);
    });

    audio.addEventListener('ended', () => {
      currentTrack = (currentTrack + 1) % files.length;
      loadTrack(currentTrack);
    });

    audio.src = files[currentTrack];
    updateActiveItem();
  </script>
</body>
</html>
