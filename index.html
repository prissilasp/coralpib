<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coralpib - Player</title>
  <style>
    body { text-align: center; font-family: sans-serif; margin: 20px 10px; background: linear-gradient(135deg, #1f1c2c, #928dab); color: #ffffff; min-height: 100vh; }
    h2 { color: #ffeb3b; text-shadow: 0 2px 4px rgba(0,0,0,0.3); font-size: 1.5rem; }
    ul { list-style: none; padding: 0; width: 100%; max-width: 450px; margin: 20px auto; text-align: left; background: #2b2640; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); overflow: hidden; box-sizing: border-box; }
    li { padding: 14px 16px; border-bottom: 1px solid #3d355c; cursor: pointer; transition: all 0.2s; color: #d0cce1; font-size: 0.95rem; }
    li:last-child { border-bottom: none; }
    li:hover { background: #3d355c; color: #ffffff; }
    li.active { background: #673ab7; font-weight: bold; color: #ffffff; border-left: 6px solid #ff4081; }
    audio { width: 100%; max-width: 450px; margin-top: 10px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }
  </style>
</head>
<body>
  <h2>Coralpib - Player Online</h2>
  <audio id="player" controls autoplay></audio>
  
  <ul id="playlist"></ul>
  
  <script>
    const audio = document.getElementById('player');
    const playlistElement = document.getElementById('playlist');
    
    const tracks = [
      '1 - Celebrai Nasceu Jesus Cristo',
      '2 - Noite de Natal',
      '3 - Tempo de Natal (Ouçam os sinos)',
      '4 - Ouço anjos a cantar Medley',
      '5 - O Natal é Cristo',
      '6 - Seguindo a Luz',
      '7 - Ao Rei Eterno demos Glória',
      '8 - Da próxima vez',
      '9 - Messias Medley'
    ];
    
    let currentTrack = 0;

    function loadTrack(index) {
      currentTrack = index;
      // Como os arquivos no GitHub agora têm esses nomes, basta adicionar o .mp3 no final
      audio.src = tracks[currentTrack] + '.mp3';
      audio.play();
      updateActiveItem();
    }

    function updateActiveItem() {
      const items = playlistElement.querySelectorAll('li');
      items.forEach((item, idx) => {
        if (idx === currentTrack) {
          item.classList.add('active');
        } else {
          item.classList.remove('active');
        }
      });
    }

    tracks.forEach((track, index) => {
      const li = document.createElement('li');
      li.textContent = track;
      li.onclick = () => loadTrack(index);
      playlistElement.appendChild(li);
    });

    audio.addEventListener('ended', () => {
      currentTrack = (currentTrack + 1) % tracks.length;
      loadTrack(currentTrack);
    });

    audio.src = tracks[currentTrack] + '.mp3';
    updateActiveItem();
  </script>
</body>
</html>
