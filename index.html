<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Coralpib - Player</title>
  <style>
    body { text-align: center; font-family: sans-serif; margin-top: 40px; background-color: #f4f4f4; }
    ul { list-style: none; padding: 0; max-width: 500px; margin: 20px auto; text-align: left; background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    li { padding: 12px 15px; border-bottom: 1px solid #eee; cursor: pointer; transition: background 0.2s; }
    li:last-child { border-bottom: none; }
    li:hover { background: #f0f0f0; }
    li.active { background: #e2f0d9; font-weight: bold; color: #385723; }
  </style>
</head>
<body>
  <h2>Coralpib - Player Online</h2>
  <audio id="player" controls style="width: 320px; margin-top: 10px;" autoplay></audio>
  
  <ul id="playlist"></ul>
  
  <script>
    const audio = document.getElementById('player');
    const playlistElement = document.getElementById('playlist');
    
    const tracks = [
      '1 - Celebrai Nasceu Jesus Cristo',
      '2 - Noite de Natal',
      '3 - Tempo de Natal (Ouçam os sinos)',
      '4 - Ouço anjos a cantar Medley',
      '5 - O Natal é Cristo',
      '6 - Seguindo a Luz',
      '7 - Ao Rei Eterno demos Glória',
      '8 - Da próxima vez',
      '9 - Messias Medley'
    ];
    
    let currentTrack = 0;

    function loadTrack(index) {
      currentTrack = index;
      audio.src = tracks[currentTrack];
      audio.play();
      updateActiveItem();
    }

    function updateActiveItem() {
      const items = playlistElement.querySelectorAll('li');
      items.forEach((item, idx) => {
        if (idx === currentTrack) {
          item.classList.add('active');
        } else {
          item.classList.remove('active');
        }
      });
    }

    // Criar a lista na tela visualmente
    tracks.forEach((track, index) => {
      const li = document.createElement('li');
      li.textContent = (index + 1) + '. ' + track.replace('.mp3', '');
      li.onclick = () => loadTrack(index);
      playlistElement.appendChild(li);
    });

    // Passar para a próxima automaticamente ao acabar
    audio.addEventListener('ended', () => {
      currentTrack = (currentTrack + 1) % tracks.length;
      loadTrack(currentTrack);
    });

    // Carregar a primeira faixa ao abrir
    audio.src = tracks[currentTrack];
    updateActiveItem();
  </script>
</body>
</html>
